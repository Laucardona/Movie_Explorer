<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Películas App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ESTILOS -->
  <link rel="stylesheet" href="./estilos/styles.css">
</head>

<body>


  <header class="navbar">
    <div class="logo">Movie App</div>

    <nav>
      <a href="#">Inicio</a>
      <a href="#">Populares</a>
      <a href="#">Favoritos</a>
    </nav>

    <div class="nav-right">
      <button class="btn-login">Login</button>
      <button class="btn-sub">Suscribirse</button>
      <!-- ID CORREGIDO -->
      <button id="themeToggle">🌙</button>
    </div>
  </header>

  
  <section class="top-controls">
    <form id="searchForm">
      <input 
        id="searchInput" 
        type="text" 
        placeholder="Buscar películas..."
      />
      <button type="submit">Buscar</button>
    </form>
  </section>
  <main>
    <div id="moviesGrid" class="movies-grid"></div>
  </main>

  
  <footer class="footer">
    <p style="text-align:center; padding:20px;">Hecho con ❤️</p>
  </footer>
  <script type="module" src="./js/main.js"></script>

</body>
</html>
